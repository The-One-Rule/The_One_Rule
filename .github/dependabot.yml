# LES MISES À JOUR DE SÉCURITÉ (phase 5, point 35).
#
# Une fois par semaine, regroupées : une PR par écosystème plutôt qu'une par
# paquet — ce dépôt n'a qu'un relecteur, et dix PR de version le lundi matin
# finiraient fermées sans être lues. Les correctifs de SÉCURITÉ, eux, passent
# hors de ce calendrier (Dependabot les ouvre dès l'avis publié).
#
# Chaque PR passe la vérification complète, e2e compris : une mise à jour
# n'entre que si le jeu tourne encore. ⚠️ `ws` et `tsx` sont des dépendances
# de PRODUCTION du serveur de salons : une mise à jour fusionnée ne vit
# qu'après un `fly deploy` (§10), comme tout le reste.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    # Les groupes ne prennent que les MINEURES et les CORRECTIFS : une montée
    # majeure arrive seule, dans sa PR. Payé le 09/10 : le groupe « outils »
    # (PR #20) mêlait trois mises à jour sans risque et QUATRE majeures
    # (TypeScript 7, ESLint 10, vitest 5, globals 17) ; `npm ci` refusait
    # tout (ERESOLVE), donc rien ne passait, pas même jsdom ou vite.
    groups:
      outils:
        dependency-type: development
        update-types: ["minor", "patch"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
    # @types/node suit la version de Node de la PRODUCTION (22 : Dockerfile,
    # `engines`, CI), jamais la dernière : des types plus récents laissent
    # passer à `tsc` une API que le serveur ne trouvera pas (phase 6, point 40).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (le compilateur réécrit) : `typescript-eslint` 8.71
      # exige `typescript < 6.1`, donc la PR serait rouge dès `npm ci`
      # chaque lundi. À retirer quand typescript-eslint l'accepte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "dépendances"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
