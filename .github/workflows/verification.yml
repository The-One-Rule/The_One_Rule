# LA VÉRIFICATION — les quatre commandes du §2 de CLAUDE.md, sur chaque PR.
#
# Jusqu'ici rien ne les relançait : tout reposait sur un lancement à la main,
# et une PR pouvait être fusionnée sans qu'aucun test n'ait tourné sur sa tête.
#
# Deux jobs et non un seul :
#   · « rapide » (tsc, vitest, build) répond en deux minutes — c'est lui qu'on
#     regarde avant de fusionner ;
#   · « e2e » dure environ cinq minutes et juge des DÉLAIS RÉELS. CLAUDE.md
#     l'écrit : il est sensible à la charge de la machine. Il tourne donc SEUL
#     sur son runner, jamais en parallèle d'autre chose dans le même job.
name: Vérification

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapide:
    name: tsc · vitest · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Les tests ET le cliquet de couverture (point 21) : un seuil manqué rend 1.
      # `npx vitest run` seul laissait passer une baisse de couverture.
      - run: npm run coverage
      - run: npx vite build
      # Le crochet de vérification `window.__tor` ne doit JAMAIS partir dans le
      # bundle livré (bloc `import.meta.env.DEV`).
      - name: aucun crochet de dev dans le bundle
        run: "! grep -rq __tor dist"
      # Plafonds gzip et encodeur QR hors du paquet principal (phase 4, point 26).
      - name: taille du paquet
        run: node scripts/taille-paquet.mjs

  e2e:
    name: e2e (salons réels)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx e2e.mjs

  # L'IMAGE FLY, CONSTRUITE ET LANCÉE (phase 5, point 32). Un import vers un
  # fichier absent des COPY du Dockerfile passe tout le reste et tue
  # l'instance au démarrage (30/08/2026). Ici l'image démarre en production,
  # répond /health, ouvre un salon, et refuse une origine inconnue.
  image:
    name: image Fly (docker build + sonde)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t tor-salons .
      - run: docker run -d --name salons -p 8080:8080 -e ALLOWED_ORIGINS=https://integration.theonerule.test tor-salons
      - run: node scripts/integration-image.mjs --url http://localhost:8080
      - name: journal du conteneur
        if: always()
        run: docker logs salons
