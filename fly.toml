# fly.toml app configuration file generated for the-one-rule-salons on 2026-08-14T00:02:45+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'the-one-rule-salons'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  METRICS_PORT = '9091'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # ATTENTION : c'est un MINIMUM, pas un plafond. Fly provisionne deux machines
  # par défaut pour la haute disponibilité, et ce réglage ne l'en empêche pas.
  # Les salons vivant en mémoire, deux machines = deux jeux de salons disjoints
  # et un « SALON INTROUVABLE » systématique entre amis. C'est arrivé en
  # production le 27/08/2026, les deux machines étant dans la même région.
  # Le nombre d'instances se fixe hors de ce fichier, et ne remonte pas :
  #     fly scale count 1 --app the-one-rule-salons
  #     node scripts/check-salons.mjs https://the-one-rule-salons.fly.dev
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[metrics]
  port = 9091
  path = '/metrics'
