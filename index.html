<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La barre du navigateur prend la couleur de la page : le sable le jour,
         la nuit en sombre. #0E1520 était le fond de l'identité Nocturne. -->
    <meta name="theme-color" content="#f4e9d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16111f" media="(prefers-color-scheme: dark)" />
    <!-- Installé sur l'écran d'accueil d'un iPhone : sans la barre de Safari.
         `#app` porte déjà les marges d'encoche (env(safe-area-inset-*)). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Rule" />
    <!-- LE TITRE PORTE LE SLOGAN, et c'est ce qui le rend cherchable.
         « THE ONE RULE » seul est une phrase anglaise banale : on y est en
         concurrence avec des millions de pages. « sometimes, obeying is the
         mistake » ne ressemble a rien d'autre — quelqu'un qui a vu le jeu
         peut le retrouver avec ces mots.
         Il est reecrit dans la langue du joueur au chargement (`i18n.ts`) ;
         cette version-ci est celle que voient les robots. -->
    <title>THE ONE RULE — sometimes, obeying is the mistake</title>
    <meta
      name="description"
      content="Une règle unique tenue toute la partie. Une consigne toutes les deux secondes. Quand elle contredit la règle, ne rien faire est la bonne réponse. Jeu de réflexes gratuit dans le navigateur, seul ou jusqu'à 10 joueurs."
    />

    <!-- Une seule URL : l'application tient sur une page. Sans canonique, un
         partage avec `?utm=...` ou `#compte=ok` devient une page distincte
         aux yeux d'un robot, et l'audience se dilue entre des doublons. -->
    <link rel="canonical" href="https://www.theonerule.party/" />

    <!-- Pas de `hreflang` : il exige des URL DISTINCTES par langue. Le
         francais et l'anglais partagent la meme page et se choisissent a
         l'execution. L'annoncer serait mentir aux robots. -->

    <!-- Ce que Google affiche dans ses resultats de jeux. Sans ce bloc, la
         page est « un site » ; avec, elle est un JEU, gratuit, jouable dans
         le navigateur. C'est la seule chose de ce fichier qui change la
         FORME du resultat et pas seulement son texte. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "THE ONE RULE",
        "alternateName": "The One Rule",
        "url": "https://www.theonerule.party/",
        "image": "https://www.theonerule.party/og.png",
        "description": "One rule holds for the whole run. A new order every two seconds. When the order breaks the rule, doing nothing is the right answer.",
        "genre": ["Reflex", "Party", "Arcade"],
        "gamePlatform": "Web browser",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": ["fr", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>

    <!-- ONGLET ET ÉCRAN D'ACCUEIL.
         Le signe est un panneau d'interdiction reconstruit avec le vocabulaire
         du jeu : le cadre est la règle, le disque est une pièce, la barre est
         le refus. Voir public/brand/README.md pour la géométrie et les
         interdits — l'accent ne porte QUE le disque.

         Le SVG d'abord : il reste net à toutes les tailles. Le PNG de 32 px
         n'est qu'un repli pour les navigateurs qui ignorent `image/svg+xml`.
         Les chemins sont relatifs, pas absolus : le site reste servable sous
         un sous-chemin. (Ils servaient aussi la v1 autonome hors ligne,
         `inline.mjs`, retirée en phase 6 — l'historique git la garde.) -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- CARTE DE PARTAGE.
         Le lien d'invitation est le seul chemin pour faire venir quelqu'un à
         distance — le code, lui, se dicte de vive voix. Il s'affichait nu.

         `og:image` exige une URL ABSOLUE : un chemin relatif ou une data-URI
         ne sont pas résolus par les robots qui fabriquent l'aperçu. Le domaine
         est donc écrit en dur, et il faut le corriger ici si le site déménage.
         Corollaire : la vignette n'apparaît qu'une fois le site déployé.

         C'est `www` et non l'apex : `theonerule.party` répond 308 vers
         `www.theonerule.party`. Annoncer l'apex ferait passer chaque robot
         d'aperçu par une redirection, que tous ne suivent pas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The One Rule" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:title" content="THE ONE RULE — sometimes, obeying is the mistake" />
    <meta
      property="og:description"
      content="Une règle unique. Deux secondes par consigne. Parfois, obéir est la faute."
    />
    <meta property="og:url" content="https://www.theonerule.party/" />
    <meta property="og:image" content="https://www.theonerule.party/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The One Rule — le signe et le nom sur fond nocturne." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THE ONE RULE — sometimes, obeying is the mistake" />
    <meta
      name="twitter:description"
      content="Une règle unique. Deux secondes par consigne. Parfois, obéir est la faute."
    />
    <meta name="twitter:image" content="https://www.theonerule.party/og.png" />
    <meta name="twitter:image:alt" content="The One Rule — le signe et le nom sur fond nocturne." />
  </head>
  <body>
    <!-- Le contenu de #app est rendu par React au chargement (`src/ui/Shell.tsx`),
         puis `main.ts` s'y branche. Voir `src/entry.tsx` et docs/adr/0010. -->
    <div id="app"></div>

    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
